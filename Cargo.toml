[package]
name = "dot"
version = "0.1.0"
edition = "2021"
description = "Dotfiles manager"
license = "MIT"

[dependencies]
anyhow = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
duct = "0.13"
etcetera = "0.8"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
